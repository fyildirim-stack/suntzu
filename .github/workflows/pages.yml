name: Siteyi gh-pages'e Yayınla

on:
  push:
    branches: ["claude/sun-tzu-war-techniques-or64na"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gh-pages branch'ine yansıt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add .nojekyll
          git commit -m "Pages yayını: .nojekyll" --allow-empty
          git push origin HEAD:gh-pages --force
